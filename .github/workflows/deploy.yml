name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 배포는 GITHUB_TOKEN으로 이뤄진다
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 하나만 돌린다. 진행 중인 것을 취소하지는 않는다 — 반쯤 올라간 상태를 만들지 않기 위해
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 깨진 빌드를 배포하지 않는다
      - run: pnpm typecheck
      - run: pnpm test
      # 중계 주소는 코드(src/multi/MatchSession.ts)에 있다 — 여기서 넣어줄 것이 없다
      - run: pnpm build

      # Pages 사이트 자체는 미리 켜져 있어야 한다(Settings → Pages → Source: GitHub Actions).
      # Actions 토큰으로는 사이트를 만들 수 없어서 enablement 옵션은 여기서 쓸 수 없다.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
